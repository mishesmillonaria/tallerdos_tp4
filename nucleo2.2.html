  <body class="fondito">
    <div class="pantalla4">
      <header class="HeaderPaso1Prompt">

          Convertí las imágenes al estilo Ghibli antes de que se acabe el tiempo

      </header>

      <main>
        <div class="contenedorTarjeta2 serv">
          <ul>

              <img src="img/uno_convertir.png" alt="" />
            </li>

            <li class="tarjeta2">
              <img src="img/dos_convertir.png" alt="" />
            </li>

            <li class="tarjeta2">
              <img src="img/tres_convertir.png" alt="" />
            </li>

            <li class="tarjeta2">
              <img src="img/cuatro_convertir.png" alt="" />
            </li>

            <li class="tarjeta2">
              <img src="img/cinco_convertir.png" alt="" />
            </li>

            <li class="tarjeta2">
              <img src="img/seis_convertir.png" alt="" />
            </li>
          </ul>
        </div>

        <p class="resaltado4">Imágenes convertidas</p>
        <p class="resaltado4">Tiempo restante</p>
      </main>

      <footer>
        <h4>
          <img src="img/pincel.png" alt="" />Mantené apretado y pasá el pincel

        </h4>
        <a
          href="paso1.2-Minijuego1.html"

          id="btnConfirmar"
          aria-disabled="true"
          tabindex="-1"
        >
          Seguir
